[workspace]
resolver = "3"
# transom-core is pure (no D-Bus, no PipeWire, no Wayland); transom holds the D-Bus services, the
# capture sources and the PipeWire sink behind seams. scripts/check-boundary.sh checks the edge.
members = ["crates/transom-core", "crates/transom"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# The same floor as the rest of the program; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/transom"
publish = false

[workspace.dependencies]
transom-core = { path = "crates/transom-core" }

thiserror = "2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
# Capture of outputs and single windows: ext-image-capture-source and ext-image-copy-capture.
wayland-client = "0.31"
# Waiting on the Wayland socket for a bounded time (the same crate wayland-client polls with), an
# anonymous in-memory file for frame buffers (`memfd_create`), a non-blocking open (`fs`) and the person's own
# user id (`process`; used only by the `debug` feature's rows file check).
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "process"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# The PipeWire client (MIT). Needs the libpipewire development files to build.
pipewire = "0.10"
# PNG encoding for Screenshot (MIT OR Apache-2.0).
image = { version = "0.25.6", default-features = false, features = ["png"] }
# Which program is calling (the portal frontend, the shell), judged against the root-owned caller table.
# zbus runs on tokio here, so the default executor feature is off. `fake` is a dev-only addition; `dev-rows`
# (a person's own rows file, `Proof::Dev`) is only behind the transom crate's `debug` feature, so no shipped
# build has it.
peephole-bus = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.4", default-features = false, features = ["tokio", "desktop"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
