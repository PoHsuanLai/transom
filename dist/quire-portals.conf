# Which portal implementation answers which interface when the desktop is "quire".
# An example: the quire desktop's own installer ships the file it uses (desktop/session/quire-portals.conf,
# the same choices). Installed as share/xdg-desktop-portal/quire-portals.conf.
[preferred]
default=quire;gtk
org.freedesktop.impl.portal.ScreenCast=quire
org.freedesktop.impl.portal.Screenshot=quire
org.freedesktop.impl.portal.RemoteDesktop=quire
org.freedesktop.impl.portal.Settings=quire
org.freedesktop.impl.portal.Inhibit=quire
# transom does not serve the file chooser; the GTK implementation does.
org.freedesktop.impl.portal.FileChooser=gtk
