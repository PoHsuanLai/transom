[package]
name = "transom"
description = "The quire desktop portal backend: Screenshot, ScreenCast, RemoteDesktop, Settings and Inhibit served on the session bus for xdg-desktop-portal."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "transom"

[[bin]]
name = "transom"
path = "src/main.rs"

[features]
# `TRANSOM_DEV_CALLERS=FILE`: callers named in a person's own rows file are let in as the portal
# frontend or the shell at `Proof::Dev` (peephole's `dev-rows`). Off by default; the desktop's test
# jail and the dev scripts build with it. A release build has neither the variable nor `dev-rows`.
debug = ["peephole-bus/dev-rows"]

[dependencies]
transom-core = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
peephole-bus = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Named now so the fill lanes edit no manifest (P2-T1: image; P2-T2: the other three).
wayland-client = { workspace = true }
rustix = { workspace = true }
wayland-protocols = { workspace = true }
pipewire = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# `introduce` makes a test's connection stand as the frontend or the shell without looking at it.
peephole-bus = { workspace = true, features = ["fake"] }
tempfile = { workspace = true }

[lints]
workspace = true
