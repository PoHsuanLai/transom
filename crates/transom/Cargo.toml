[package]
name = "transom"
description = "The quire desktop portal backend: Screenshot, ScreenCast, RemoteDesktop, Settings and Inhibit served on the session bus for xdg-desktop-portal."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "transom"

[[bin]]
name = "transom"
path = "src/main.rs"

[dependencies]
transom-core = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Named now so the fill lanes edit no manifest (P2-T1: image; P2-T2: the other three).
wayland-client = { workspace = true }
rustix = { workspace = true }
wayland-protocols = { workspace = true }
pipewire = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
